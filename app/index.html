<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>活动抽奖系统</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="control-panel" aria-label="抽奖控制台">
        <div class="topline">
          <span class="brand-mark" aria-label="AT&S">AT&amp;S</span>
          <div id="clockText" class="clock-text">2026-09-01 10:25:31</div>
        </div>

        <div class="hero-copy">
          <p class="eyebrow">活动现场抽奖</p>
          <h1 id="activityTitle">活动抽奖</h1>
          <p id="drawStatusText" class="draw-status">待抽奖</p>
        </div>

        <button id="startButton" class="draw-button" type="button">
          <span>一键抽奖</span>
        </button>

        <div class="stats-grid" aria-label="抽奖统计">
          <div>
            <span>名单人数</span>
            <strong id="employeeCount">0</strong>
          </div>
          <div>
            <span>中奖人数</span>
            <strong id="winnerCount">0</strong>
          </div>
        </div>

        <div class="control-footer">
          <span id="footerActivityTitle">活动名称：活动抽奖</span>
          <button id="adminButton" class="small-button" type="button">管理员功能</button>
        </div>
      </section>

      <section id="showcasePanel" class="showcase-panel" aria-label="抽奖展示区">
        <div class="showcase-header">
          <div>
            <p class="eyebrow">Showcase</p>
            <h2 id="showcaseTitle">奖品信息</h2>
          </div>
          <p id="showcaseMeta">等待导入名单</p>
        </div>

        <div id="prizeShowcase" class="prize-showcase"></div>

        <div id="drawAnimation" class="draw-animation" hidden>
          <div class="animation-orbit">
            <span></span>
            <span></span>
            <span></span>
          </div>
          <div>
            <h3>抽奖中</h3>
          </div>
        </div>

        <div id="winnersShowcase" class="winners-showcase" hidden>
          <div id="winnerTicker" class="winner-ticker"></div>
        </div>
      </section>
    </main>

    <dialog id="adminLoginDialog" class="login-dialog">
      <form method="dialog">
        <div class="dialog-header">
          <div>
            <h2>管理员登录</h2>
            <p>请输入管理员密码</p>
          </div>
          <button class="close-button" value="close" aria-label="关闭">×</button>
        </div>
        <div class="login-body">
          <input id="adminPasswordInput" type="password" autocomplete="current-password" placeholder="管理员密码" />
          <button id="loginSubmitButton" type="button">进入管理</button>
        </div>
      </form>
    </dialog>

    <dialog id="adminDialog" class="admin-dialog">
      <form method="dialog">
        <div class="dialog-header">
          <div>
            <h2>管理员功能</h2>
            <p id="workbookPathText">当前配置：</p>
            <p id="dataStatus" class="data-status">等待读取配置</p>
          </div>
          <button class="close-button" value="close" aria-label="关闭">×</button>
        </div>

        <div class="admin-toolbar">
          <label class="title-setting" for="activityTitleInput">
            <span>活动标题</span>
            <input id="activityTitleInput" type="text" maxlength="40" placeholder="请输入活动标题" />
          </label>
          <div class="admin-command-grid">
            <button id="saveTitleButton" type="button">保存标题</button>
            <button id="importButton" type="button">导入抽奖名单</button>
            <button id="exportButton" type="button">导出中奖信息</button>
            <button id="refreshButton" type="button">刷新数据</button>
            <button id="resetButton" class="danger-button" type="button">重置数据</button>
          </div>
        </div>

        <div class="admin-tabs">
          <button type="button" class="tab-button active" data-tab="employees">抽奖名单</button>
          <button type="button" class="tab-button" data-tab="prizes">奖品设置</button>
          <button type="button" class="tab-button" data-tab="records">中奖信息</button>
        </div>

        <div id="adminTableWrap" class="admin-table-wrap"></div>
      </form>
    </dialog>

    <input id="rosterFileInput" class="hidden-file-input" type="file" accept=".xlsx,.xlsm,.xls" />
    <input
      id="prizeImageInput"
      class="hidden-file-input"
      type="file"
      accept="image/png,image/jpeg,image/webp,image/gif,image/bmp,image/svg+xml"
    />
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="./config.js"></script>
    <script src="./vendor/xlsx.full.min.js"></script>
    <script src="./renderer.js"></script>
  </body>
</html>
