<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>活动抽奖系统</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="topbar-spacer"></div>
        <h1 id="activityTitle">活动抽奖</h1>
        <div class="clock-area">
          <div id="clockText" class="clock-text">2026-09-01 10:25:31</div>
          <button id="adminButton" class="small-button" type="button">管理员功能</button>
        </div>
      </header>

      <section class="input-row" aria-label="工号输入">
        <label for="employeeInput">请输入或扫描工号</label>
        <div class="input-stack">
          <input id="employeeInput" type="text" autocomplete="off" placeholder="请输入或扫描工号" />
          <div id="hintText" class="hint-text">工号为7位数字；扫码枪9位编码会自动识别前7位</div>
        </div>
      </section>

      <section class="main-grid">
        <div id="prizeBoard" class="prize-board" aria-label="九宫格奖品展示">
          <article class="prize-card" data-card-index="0"></article>
          <article class="prize-card" data-card-index="1"></article>
          <article class="prize-card" data-card-index="2"></article>
          <article class="prize-card" data-card-index="3"></article>
          <button id="startButton" class="start-button" type="button">开始<br />抽奖</button>
          <article class="prize-card" data-card-index="4"></article>
          <article class="prize-card" data-card-index="5"></article>
          <article class="prize-card" data-card-index="6"></article>
          <article class="prize-card" data-card-index="7"></article>
        </div>

        <aside class="side-column">
          <section class="result-panel">
            <h2 id="resultTitle">抽奖状态</h2>
            <img id="resultImage" src="../assets/prizes/gift.png" alt="中奖礼盒" hidden />
            <div id="resultText" class="result-text">等待抽奖</div>
            <div id="resultPrize" class="result-prize">请扫描工牌或输入工号</div>
          </section>

          <section class="records-panel">
            <div class="records-heading">
              <h2>中奖记录</h2>
              <span>仅展示最近10条</span>
            </div>
            <div class="records-table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>工号</th>
                    <th>奖品</th>
                    <th>时间</th>
                  </tr>
                </thead>
                <tbody id="recordsBody"></tbody>
              </table>
            </div>
          </section>
        </aside>
      </section>

      <footer class="footer-bar">
        <span id="footerActivityTitle">活动名称：活动抽奖</span>
        <span id="employeeCount">抽奖名单人数：0 人</span>
        <span id="participantCount">已参与人数：0 人</span>
      </footer>
    </main>

    <dialog id="adminLoginDialog" class="login-dialog">
      <form method="dialog">
        <div class="dialog-header">
          <div>
            <h2>管理员登录</h2>
            <p>请输入管理员密码</p>
          </div>
          <button class="close-button" value="close" aria-label="关闭">×</button>
        </div>
        <div class="login-body">
          <input id="adminPasswordInput" type="password" autocomplete="current-password" placeholder="管理员密码" />
          <button id="loginSubmitButton" type="button">进入管理</button>
        </div>
      </form>
    </dialog>

    <dialog id="adminDialog" class="admin-dialog">
      <form method="dialog">
        <div class="dialog-header">
          <div>
            <h2>管理员功能</h2>
            <p id="workbookPathText">当前配置：</p>
            <p id="dataStatus" class="data-status">等待读取配置</p>
          </div>
          <button class="close-button" value="close" aria-label="关闭">×</button>
        </div>

        <div class="admin-toolbar">
          <label class="title-setting" for="activityTitleInput">
            <span>活动标题</span>
            <input id="activityTitleInput" type="text" maxlength="40" placeholder="请输入活动标题" />
          </label>
          <div class="admin-command-grid">
            <button id="saveTitleButton" type="button">保存标题</button>
            <button id="importButton" type="button">导入抽奖名单</button>
            <button id="exportButton" type="button">导出中奖信息</button>
            <button id="refreshButton" type="button">刷新数据</button>
            <button id="resetButton" class="danger-button" type="button">重置数据</button>
          </div>
        </div>

        <div class="admin-tabs">
          <button type="button" class="tab-button active" data-tab="employees">抽奖名单</button>
          <button type="button" class="tab-button" data-tab="prizes">奖品设置</button>
          <button type="button" class="tab-button" data-tab="records">中奖信息</button>
        </div>

        <div id="adminTableWrap" class="admin-table-wrap"></div>
      </form>
    </dialog>

    <input id="rosterFileInput" class="hidden-file-input" type="file" accept=".xlsx,.xlsm,.xls" />
    <input
      id="prizeImageInput"
      class="hidden-file-input"
      type="file"
      accept="image/png,image/jpeg,image/webp,image/gif,image/bmp,image/svg+xml"
    />
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="./config.js"></script>
    <script src="./vendor/xlsx.full.min.js"></script>
    <script src="./renderer.js"></script>
  </body>
</html>
